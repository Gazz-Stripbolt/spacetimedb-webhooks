name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Rust toolchain (wasm32)
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown --component clippy,rustfmt
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - name: Rust
        run: |
          cargo fmt --all --check
          cargo clippy --release --target wasm32-unknown-unknown -- -D warnings
      - name: TypeScript
        run: |
          npm run gen:page
          npm run typecheck
      - name: C#
        env:
          EXPERIMENTAL_WASM_AOT: 1   # what `spacetime build` sets for NativeAOT-LLVM (net10.0) projects
        run: dotnet build demo/csharp -c Release

  # Standalone blocks module HTTP to loopback, and the outbound tests deliver to a receiver on
  # 127.0.0.1 (and back into the module itself), so they use a build with SpacetimeDB's own
  # `allow_loopback_http_for_tests` feature, cached per version.
  dev-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Install SpacetimeDB CLI
        run: |
          curl -sSf https://install.spacetimedb.com | sh -s -- --yes
          # The installer gives the latest GitHub release, which can lag the crates/npm/NuGet release.
          "$HOME/.local/bin/spacetime" version install 2.12.0 && "$HOME/.local/bin/spacetime" version use 2.12.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - id: ver
        run: echo "version=$(spacetime --version | sed -n 's/.*tool version \([0-9.]*\);.*/\1/p')" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v4
        with:
          path: .dev-server/spacetimedb-standalone-${{ steps.ver.outputs.version }}
          key: dev-server-${{ runner.os }}-${{ steps.ver.outputs.version }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          scripts/dev-server.sh build
          rm -rf .dev-server/SpacetimeDB-*

  e2e:
    needs: dev-server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lang: [rust, csharp, typescript]
    name: e2e (${{ matrix.lang }})
    steps:
      - uses: actions/checkout@v5
      - name: Rust toolchain (wasm32)
        if: matrix.lang == 'rust'
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        if: matrix.lang == 'rust'
      - uses: actions/setup-dotnet@v4
        if: matrix.lang == 'csharp'
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install SpacetimeDB CLI
        run: |
          curl -sSf https://install.spacetimedb.com | sh -s -- --yes
          # The installer gives the latest GitHub release, which can lag the crates/npm/NuGet release.
          "$HOME/.local/bin/spacetime" version install 2.12.0 && "$HOME/.local/bin/spacetime" version use 2.12.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        with:
          path: .dev-server/spacetimedb-standalone-${{ needs.dev-server.outputs.version }}
          key: dev-server-${{ runner.os }}-${{ needs.dev-server.outputs.version }}
          fail-on-cache-miss: true
      - name: Start dev server
        run: |
          mkdir -p ~/.config/spacetime
          nohup scripts/dev-server.sh start > server.log 2>&1 &
          for i in $(seq 60); do curl -sf -o /dev/null http://127.0.0.1:3000/v1/ping && break; sleep 1; done
      - name: End-to-end tests
        run: scripts/e2e.sh ${{ matrix.lang }}
      - name: Throughput
        run: scripts/bench.sh ${{ matrix.lang }} 500 16
      - name: Server log
        if: failure()
        run: tail -n 200 server.log || true
