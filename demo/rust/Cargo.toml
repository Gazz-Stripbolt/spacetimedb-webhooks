[package]
name = "webhooks_demo"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
spacetimedb = { version = "2.12.*", features = ["unstable"] }
log = "0.4"
http = "1"
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["fast"] }
